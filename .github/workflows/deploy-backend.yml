name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test

      - name: Build Backend (NestJS)
        run: npm run build

  deploy-render:
    name: Trigger Render Deployment
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Pinging Render Deploy Hook..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body (HTTP $http_code)"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully triggered Render deployment!"
          else
            echo "Render Deploy Hook returned HTTP $http_code"
            exit 1
          fi

      - name: Log Notice If Hook Is Missing
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Notice: RENDER_DEPLOY_HOOK_URL secret is not set in this repository."
          echo "If Render auto-deploy is enabled on branch ${{ github.ref_name }}, Render will deploy automatically from the push."
          echo "To trigger deployments via GitHub Actions, add RENDER_DEPLOY_HOOK_URL to your GitHub repository secrets."
