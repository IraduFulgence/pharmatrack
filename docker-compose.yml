services:
  # 1. Backend (NestJS) - Connects to Aiven
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmatrack-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env    
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - pharmatrack-network

   # 2. Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: pharmatrack-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pharmatrack-network

  # 3. Mobile (Expo Dev Server)
  mobitrack:
    build:
      context: ./mobitrack
      dockerfile: Dockerfile
    container_name: pharmatrack-mobile
    restart: unless-stopped
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    environment:
      
      REACT_NATIVE_PACKAGER_HOSTNAME: 192.168.1.50
    networks:
      - pharmatrack-network

networks:
  pharmatrack-network:
    driver: bridge